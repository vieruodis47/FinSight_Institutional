name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping and wake Streamlit app
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            execSync('npx playwright install chromium', { stdio: 'inherit' });
            const { chromium } = require('playwright');
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://finsightinstitutional-jfr9vaxfjq8ezuptiome3k.streamlit.app/', {
              waitUntil: 'networkidle',
              timeout: 60000
            });
            const wakeBtn = page.locator('button:has-text("Yes, get this app back up")');
            if (await wakeBtn.count() > 0) {
              await wakeBtn.click();
              await page.waitForTimeout(15000);
            }
            await browser.close();
